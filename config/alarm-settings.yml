# Apache SkyWalking Alarm Settings for Enterprise Observability
rules:
  # Alert rule for high service response time (P99 / Average)
  service_resp_time_rule:
    metrics-name: service_resp_time
    op: ">"
    threshold: 1000
    period: 10
    count: 3
    silence-period: 5
    message: Average response time of service {name} has exceeded 1000ms in 3 of the last 10 minutes.

  # Alert rule for Service SLA drop below threshold
  service_sla_rule:
    metrics-name: service_sla
    op: "<"
    threshold: 9900 # 99% SLA is represented as 9900 in SkyWalking
    period: 10
    count: 3
    silence-period: 5
    message: SLA of service {name} dropped below 99% in 3 of the last 10 minutes.

  # Alert rule for high percentile (P99 latency)
  service_p99_latency_rule:
    metrics-name: service_percentile
    op: ">"
    threshold: 2000 # 2000ms (P99 index is 4 in percentile array: P50, P75, P90, P95, P99)
    period: 10
    count: 3
    silence-period: 10
    message: P99 latency of service {name} exceeded 2000ms.

  # Alert rule for Service Instance unavailability / relationship disconnect
  endpoint_relation_resp_time_rule:
    metrics-name: endpoint_relation_resp_time
    op: ">"
    threshold: 1500
    period: 10
    count: 3
    silence-period: 5
    message: Relation endpoint response time {name} exceeded 1500ms.

# Webhook configuration for alerting dispatch
webhooks:
  # Slack incoming webhook configuration (simulated for enterprise SRE notifications)
  - url: http://alert-gateway.local/webhooks/slack
  # Microsoft Teams / PagerDuty webhook configurations can be added similarly
  - url: http://alert-gateway.local/webhooks/teams
