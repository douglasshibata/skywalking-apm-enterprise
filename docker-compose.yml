services:
  # Elasticsearch 8.x storage engine backend for SkyWalking OAP Server
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: skywalking-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'status'"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - es_data:/usr/share/elasticsearch/data

  # SkyWalking OAP (Observability Analysis Platform) Server Core
  oap:
    image: apache/skywalking-oap-server:9.6.0
    container_name: skywalking-oap
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "11800:11800" # gRPC collector port for agents
      - "12800:12800" # HTTP REST API & UI connection port
    environment:
      SW_STORAGE: elasticsearch
      SW_STORAGE_ES_CLUSTER_NODES: elasticsearch:9200
      SW_CORE_RECORD_DATA_TTL: 3 # Metrics & Traces TTL in days (production default is 7-14)
      SW_CORE_METRICS_DATA_TTL: 7 # Aggregated metrics TTL in days
    volumes:
      # Bind alarm configurations dynamically
      - ./config/alarm-settings.yml:/skywalking/config/alarm-settings.yml

  # SkyWalking Web App UI (Booster Dashboard UI)
  ui:
    image: apache/skywalking-ui:9.6.0
    container_name: skywalking-ui
    depends_on:
      - oap
    ports:
      - "8080:8080" # Web console accessible on http://localhost:8080
    environment:
      SW_OAP_ADDRESS: http://oap:12800

  # Order Service instrumented with SkyWalking Java Agent (Simulated via zero-code)
  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: order-service
    ports:
      - "8081:8081"
    depends_on:
      - oap
      - payment-service
    environment:
      - PAYMENT_SERVICE_URL=http://payment-service:8082
      - JAVA_TOOL_OPTIONS=-javaagent:/skywalking/agent/skywalking-agent.jar
      - SW_AGENT_NAME=order-service
      - SW_AGENT_COLLECTOR_BACKEND_SERVICES=oap:11800
      - SW_LOGGING_LEVEL=INFO

  # Payment Service instrumented with SkyWalking Java Agent
  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: payment-service
    ports:
      - "8082:8082"
    depends_on:
      - oap
    environment:
      - JAVA_TOOL_OPTIONS=-javaagent:/skywalking/agent/skywalking-agent.jar
      - SW_AGENT_NAME=payment-service
      - SW_AGENT_COLLECTOR_BACKEND_SERVICES=oap:11800
      - SW_LOGGING_LEVEL=INFO

volumes:
  es_data:
    driver: local
